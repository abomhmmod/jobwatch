name: jobwatch

on:
  schedule:
    # احتياط. النبضات الدوريّة يقوم بها «الإيقاظ الذاتيّ» (مهمّة wake في آخر هذا الملفّ) كلّ ساعة.
    # جدولة GitHub هذه تُسقط كثيرًا من مواعيدها. فإن عملت جاء الفحص في موعده تمامًا
    # (6:07 و9:07 و12:07 و15:07 بتوقيت UTC = 9:07 و12:07 و15:07 و18:07 بتوقيت دمشق)، وأعادت تشغيل السلسلة إن انقطعت.
    - cron: '7 */3 * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'أرسل رسالة اختبار فقط (دون فحص)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # لا يتداخل تشغيلان. (القيد على هذه المهمّة وحدها، حتّى لا يحجز انتظارُ مهمّة wake النبضةَ التالية.)
    concurrency:
      group: jobwatch
      cancel-in-progress: false
    env:
      TZ: Asia/Damascus
      PYTHONUTF8: '1'
      # مواعيد الفحص اليوميّة بتوقيت دمشق. كلّ تشغيل «نبضة»، ولا تفحص النبضة إلّا إن مرّ أحد هذه
      # المواعيد منذ آخر فحص ناجح (due.py). فإن تأخّرت نبضة أو سقطت، فحصت التي بعدها.
      SLOTS: '09:07 12:07 15:07 18:07'
      TEST_NOTIFY: ${{ inputs.test_notify == true }}
      # التشغيل اليدويّ (زرّ Run workflow) يفحص فورًا. أمّا نبضات الجدولة والإيقاظ الذاتيّ فتفحص حين يحلّ موعد.
      MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]' }}
    steps:
      # آخر نسخة من الفرع لا نسخة لحظة الطلب، حتّى يرى التشغيل state.json الذي حفظه التشغيل السابق.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: هل حان موعد فحص؟
        id: plan
        # due.py: الرمز 0 افحص، و3 لا تفحص. وأيّ رمز غيرهما خطأ (سطر SLOTS لا يُفهم مثلًا)،
        # فيفحص احتياطًا بدل أن يتوقّف الفحص بصمت، وينبّه الفحصُ تيلغرام (DUE_ERROR).
        run: |
          if [ "$TEST_NOTIFY" = true ]; then mode=test
          elif [ "$MANUAL" = true ]; then mode=scan; echo 'تشغيل يدويّ: فحص فوريّ.'
          else
            rc=0; python3 due.py $SLOTS || rc=$?
            case "$rc" in
              0) mode=scan ;;
              3) mode=idle ;;
              *) mode=scan
                 echo "::error::تعذّر على due.py الحكم على الموعد (الرمز $rc)، فالفحص يجري احتياطًا. راجع السطر SLOTS."
                 echo 'DUE_ERROR=1' >> "$GITHUB_ENV" ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: فحص رمز البوت
        if: steps.plan.outputs.mode != 'idle'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::السرّ TELEGRAM_TOKEN أو TELEGRAM_CHAT_ID غير موجود. توقّف التشغيل قبل الفحص."
            exit 1
          fi
          resp=$(curl -sS --max-time 30 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe" || true)
          if ! printf '%s' "$resp" | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j.get("ok"); print("البوت:", j["result"]["username"])'; then
            echo "::error::رفض تيلغرام رمز البوت. توقّف التشغيل قبل الفحص حتّى لا تضيع إعلانات."
            exit 1
          fi

      - uses: actions/setup-python@v7
        if: steps.plan.outputs.mode != 'idle'
        with:
          python-version: '3.12'
          cache: pip

      - name: تثبيت المكتبات
        if: steps.plan.outputs.mode != 'idle'
        run: |
          pip install -q -r requirements.txt
          echo "PW_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_ENV"

      - name: ذاكرة متصفّح chromium
        if: steps.plan.outputs.mode == 'scan'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: تثبيت chromium (لا يُنزَّل إن كان في الذاكرة)
        if: steps.plan.outputs.mode == 'scan'
        run: python -m playwright install --only-shell chromium

      - name: كتابة config.json من الأسرار
        if: steps.plan.outputs.mode != 'idle'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os
          c = json.load(open('config.public.json', encoding='utf-8'))
          c['bot_token'] = os.environ['TELEGRAM_TOKEN']
          c['chat_id'] = int(os.environ['TELEGRAM_CHAT_ID'])
          json.dump(c, open('config.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY

      - name: رسالة اختبار
        if: steps.plan.outputs.mode == 'test'
        run: python jobwatch.py --test

      - name: الفحص
        if: steps.plan.outputs.mode == 'scan'
        run: python jobwatch.py

      - name: حذف config.json
        if: always()
        run: rm -f config.json

      # إن فشل الفحص (أو ما قبله) نُبّه تيلغرام مرّةً واحدة، وتُعيد النبضات التالية المحاولة كلّ ساعة
      # (last_run لم يتغيّر). والعلامة scan_failing في state.json تمنع تكرار التنبيه، وأوّل فحص ناجح
      # بعدها يرسل «عاد فحص الوظائف يعمل» ويمحوها.
      - name: تنبيه عند فشل الفحص
        if: failure() && steps.plan.outputs.mode == 'scan'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          try:
              s = json.load(open('state.json', encoding='utf-8'))
          except Exception:
              s = {}
          if s.get('scan_failing'):
              print('سبق التنبيه بهذا التعطّل.')
              raise SystemExit
          text = ('⚠️ ' + os.environ['GITHUB_REPOSITORY'] + ': تعذّر فحص الوظائف في هذا التشغيل. '
                  'ستعيد النبضات التالية المحاولة كلّ ساعة، وسأخبرك حين يعود. التفاصيل في تبويب Actions.')
          data = urllib.parse.urlencode({'chat_id': os.environ['TELEGRAM_CHAT_ID'], 'text': text}).encode()
          try:
              urllib.request.urlopen('https://api.telegram.org/bot' + os.environ['TELEGRAM_TOKEN'] + '/sendMessage',
                                     data, timeout=30)
          except Exception as e:
              print('تعذّر التنبيه:', type(e).__name__)
              raise SystemExit
          s['scan_failing'] = True
          with open('state.json', 'w', encoding='utf-8') as f:
              json.dump(s, f, ensure_ascii=False, indent=2)
          print('أُرسل التنبيه.')
          PY

      - name: حفظ state.json
        if: always() && steps.plan.outputs.mode == 'scan'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if git diff --cached --quiet; then echo 'لا تغيير في الحالة'; exit 0; fi
          git commit -q -m "state: $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

  wake:
    # الإيقاظ الذاتيّ: بعد انتهاء النبضة ينتظر GitHub مدّة مؤقّت البيئة wake-60 (60 دقيقة؛ تُضبط من
    # Settings ← Environments)، ثمّ يطلب هذا التشغيلُ تشغيلًا جديدًا. والانتظار لا يشغل خادمًا.
    # إن بدأ في الأثناء تشغيل أحدث (من الجدولة أو يدويًّا) فهو الذي يُكمل وهذا يتوقّف، فتبقى سلسلة واحدة.
    # يعمل ولو فشل ما قبله، حتّى لا تنقطع السلسلة. وإيقاف البوت يكون بـ Disable workflow.
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: wake-60
      deployment: false
    permissions:
      actions: write
    steps:
      - name: Request the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # صمام أمان: لا يُطلب تشغيل جديد قبل مرور هذه الثواني على بدء هذا التشغيل. فلو لم يُطبَّق
          # مؤقّت الانتظار (حُذفت البيئة أو أُلغي مؤقّتها، أو صار المستودع خاصًّا على الخطّة المجّانيّة)
          # لتتابعت التشغيلات بلا توقّف.
          MIN_AGE: 300
        run: |
          warn() {  # $1: سطر في سجلّ التشغيل، $2: تنبيه إلى تيلغرام
            echo "::error::$1"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=⚠️ ${GITHUB_REPOSITORY}: $2") || true
            echo "Telegram warning: HTTP ${code:-none}"
          }
          wf="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"; wf="${wf%@*}"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/$wf"

          started=""
          for i in 1 2 3 4 5 6; do
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at 2>/dev/null) && [ -n "$started" ] && break
            sleep 20
          done
          if [ -z "$started" ]; then
            warn "Could not reach the GitHub API to read this run's start time." \
                 "تعذّر الاتّصال بواجهة GitHub، فتوقّف الفحص الدوريّ. لإعادته افتح تبويب Actions في المستودع واضغط Run workflow."
            exit 1
          fi
          age=$(( $(date +%s) - $(date -d "$started" +%s) ))
          if [ "$age" -lt "$MIN_AGE" ]; then
            warn "This run is only ${age}s old, so the wait timer was not applied. Not requesting another run." \
                 "مؤقّت الانتظار لم يُطبَّق، فأوقفتُ الإيقاظ الذاتيّ حتّى لا تتتابع التشغيلات بلا توقّف. راجع المؤقّت في Settings ← Environments، وتأكّد أنّ المستودع عامّ، ثمّ اضغط Run workflow في تبويب Actions."
            exit 1
          fi

          newest=""
          for i in 1 2 3 4 5 6; do
            newest=$(gh api "$api/runs?per_page=1" --jq '.workflow_runs[0] | "\(.id) \(.status)"' 2>/dev/null) && [ -n "$newest" ] && break
            sleep 20
          done
          if [ -n "$newest" ] && [ "${newest%% *}" != "$GITHUB_RUN_ID" ] && [ "${newest#* }" != "completed" ]; then
            echo "A newer run (${newest%% *}) is under way; it will request the next one."
            exit 0
          fi

          err=""
          for i in 1 2 3 4 5 6 7 8; do
            if err=$(gh api -X POST "$api/dispatches" -f ref="$REF" 2>&1); then
              echo "Next run requested."
              exit 0
            fi
            echo "Attempt $i failed: $err"
            case "$err" in
              *"disabled workflow"*) echo "The workflow is disabled, so the chain stops here."; exit 0 ;;
              *"HTTP 403"*|*"HTTP 404"*|*"HTTP 422"*) break ;;
            esac
            sleep 45
          done
          warn "Could not request the next run: $err" \
               "تعذّر طلب التشغيل التالي، فتوقّف الفحص الدوريّ. لإعادته افتح تبويب Actions في المستودع واضغط Run workflow."
          exit 1
